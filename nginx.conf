server {
    listen 8080;
    server_name _;

    location /health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://jian.jiandin.com/;

        proxy_set_header Host "jian.jiandin.com";
        proxy_ssl_server_name on;

        proxy_set_header X‑Real‑IP $remote_addr;
        proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;
        proxy_set_header X‑Forwarded‑Proto $scheme;

        # ✅拦截后端返回的302响应头，把https://jian.jiandin.com/全部替换成访问域名
        proxy_redirect ~^https://jian\.jiandin\.com(.*)$ $scheme://$host$1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 只替换HTML页面内写死的链接，JS文件不去碰
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter 'https://jian.jiandin.com' '$scheme://$host';
        sub_filter_once off;
    }
}
