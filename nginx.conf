server {
    listen 8080;
    server_name _;

    location /health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://jian.jiandin.com/;
        proxy_ssl_server_name on;

        proxy_set_header Host jian.jiandin.com;
        proxy_set_header X‑Forwarded‑Host $host;
        proxy_set_header X‑Public‑Host $host;

        proxy_set_header X‑Real‑IP $remote_addr;
        proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;
        proxy_set_header X‑Forwarded‑Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 关闭压缩，sub_filter才能修改JSON和HTML
        proxy_set_header Accept‑Encoding "";

        # 改写302响应头Location
        proxy_redirect https://jian.jiandin.com/ $scheme://$host/;

        # 所有响应类型：html、json、js全部替换字符串
        sub_filter_types *;
        sub_filter 'https://jian.jiandin.com' '$scheme://$host';
        sub_filter_once off;
    }
}
