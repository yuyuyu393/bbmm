server {
    listen 8080;
    server_name _;

    location /health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://jian.jiandin.com/;
        # 重点：写死源站Host，绝对不能写 $host
        proxy_set_header Host "jian.jiandin.com";

        proxy_set_header X‑Real‑IP $remote_addr;
        proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;
        proxy_set_header X‑Forwarded‑Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 把网页里面所有硬编码的源站域名替换成你的DO域名，解决点链接跳出去
        sub_filter 'https://jian.jiandin.com' '$scheme://$host';
        sub_filter_once off;
    }
}
