server {
    listen 8080;
    server_name _;

    location /health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://jian.jiandin.com/;
        proxy_set_header Host $host;

        proxy_set_header X‑Real‑IP $remote_addr;
        proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;
        proxy_set_header X‑Forwarded‑Proto $scheme;

        # 关键：拦截源站返回的302 Location头，把源站域名替换成访问域名，阻止浏览器直接跳走
        proxy_redirect https://jian.jiandin.com/ /;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 关闭gzip，sub_filter才生效
        proxy_set_header Accept-Encoding "";
        sub_filter 'https://jian.jiandin.com' '$scheme://$host';
        sub_filter_once off;
    }
}
