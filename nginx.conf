server {
    listen 8080;
    server_name _;

    location /health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass https://jian.jiandin.com/;
        proxy_set_header Host "jian.jiandin.com";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_set_header X‑Real‑IP $remote_addr;
        proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;
        proxy_set_header X‑Forwarded‑Proto $scheme;

        # 拦截所有后端返回301/302跳转，任何子路径全部改写为你的DO域名
        proxy_redirect ~^https://jian\.jiandin\.com(.*)$ $scheme://$host$1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 关闭gzip压缩，否则sub_filter完全失效
        proxy_set_header Accept-Encoding "";

        # ⚠️重点：*代表所有文件类型，html/js/css/json全部执行字符串替换
        sub_filter_types *;
        sub_filter 'https://jian.jiandin.com' '$scheme://$host';
        sub_filter_once off;
    }
}
